name: Daily Kühlungsborn Render

on:
  workflow_dispatch:

  schedule:
    # 05:17 UTC = 07:17 CEST
    # 06:17 UTC = 07:17 CET
    # generate.py checks Europe/Berlin.
    - cron: "17 5,6 * * *"

jobs:
  render:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily image
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          TARGET_HOUR: "7"
        run: python generate.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs

          if git diff --cached --quiet
          then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "Add daily Kühlungsborn render"
          git push
